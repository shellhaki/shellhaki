    <circle cx="236" cy="125" r="6" fill="#ec915c"/>
    <text x="250" y="130" class="label">Zig</text>
    <text x="415" y="130" class="muted" text-anchor="end">1.7%</text>
  </g>
  <g class="fade" style="animation-delay:0.62s">
    <circle cx="31" cy="155" r="6" fill="#89e051"/>
    <text x="45" y="160" class="label">Shell</text>
    <text x="210" y="160" class="muted" text-anchor="end">1.5%</text>
  </g>
  <g class="fade" style="animation-delay:0.7s">
    <circle cx="236" cy="155" r="6" fill="#fcb32c"/>
    <text x="250" y="160" class="label">MDX</text>
    <text x="415" y="160" class="muted" text-anchor="end">1.3%</text>
