    <text x="210" y="130" class="muted" text-anchor="end">3.0%</text>
  </g>
  <g class="fade" style="animation-delay:0.54s">
    <circle cx="236" cy="125" r="6" fill="#ec915c"/>
    <text x="250" y="130" class="label">Zig</text>
    <text x="415" y="130" class="muted" text-anchor="end">2.2%</text>
  </g>
  <g class="fade" style="animation-delay:0.62s">
    <circle cx="31" cy="155" r="6" fill="#e34c26"/>
    <text x="45" y="160" class="label">HTML</text>
    <text x="210" y="160" class="muted" text-anchor="end">1.4%</text>
  </g>
  <g class="fade" style="animation-delay:0.7s">
    <circle cx="236" cy="155" r="6" fill="#f1e05a"/>
    <text x="250" y="160" class="label">JavaScript</text>
    <text x="415" y="160" class="muted" text-anchor="end">1.3%</text>
  </g>
  <g class="fade" style="animation-delay:0.78s">
    <circle cx="31" cy="185" r="6" fill="#89e051"/>
    <text x="45" y="190" class="label">Shell</text>
    <text x="210" y="190" class="muted" text-anchor="end">1.3%</text>
  </g>
  <g class="fade" style="animation-delay:0.8600000000000001s">
    <circle cx="236" cy="185" r="6" fill="#dea584"/>
    <text x="250" y="190" class="label">Rust</text>
    <text x="415" y="190" class="muted" text-anchor="end">0.8%</text>
  </g>
</svg>