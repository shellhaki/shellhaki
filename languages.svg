<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210" role="img" aria-label="Most Used Languages">
  <title>Most Used Languages</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="50%" stop-color="#E100FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" class="bg-a"/>
      <stop offset="100%" class="bg-b"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .bg-a { stop-color: #140b24; } .bg-b { stop-color: #0b1320; }
    .title { font-size: 18px; font-weight: 700; }
    .label { font-size: 14px; fill: #c9d1d9; }
    .value { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .big { font-size: 28px; font-weight: 700; fill: #ffffff; }
    .muted { font-size: 12px; fill: #8b949e; }
    .track { stroke: #ffffff; stroke-opacity: .08; }
    .divider { stroke: #ffffff; stroke-opacity: .1; }
    .fade { opacity: 0; animation: fade .6s ease-out forwards; }
    .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1s ease-out .2s forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-color-scheme: light) {
      .bg-a { stop-color: #faf5ff; } .bg-b { stop-color: #f0fbff; }
      .label { fill: #3d444d; } .value, .big { fill: #1f2328; } .muted { fill: #59636e; }
      .track, .divider { stroke: #1f2328; }
    }
  </style>
  <rect x="0.5" y="0.5" width="439" height="209" rx="14" fill="url(#bg)" stroke="url(#accent)" stroke-opacity=".6"/>
  <text x="25" y="38" class="title fade" fill="url(#accent)">Most Used Languages</text>
  <clipPath id="bar"><rect x="25" y="58" width="390" height="10" rx="5"/></clipPath>
  <rect x="25" y="58" width="390" height="10" rx="5" class="track" fill="none"/>
  <g clip-path="url(#bar)"><g class="grow"><rect x="25.00" y="58" width="206.10" height="10" fill="#3178c6"/><rect x="231.10" y="58" width="137.07" height="10" fill="#00ADD8"/><rect x="368.17" y="58" width="11.65" height="10" fill="#663399"/><rect x="379.83" y="58" width="8.39" height="10" fill="#ec915c"/><rect x="388.22" y="58" width="5.40" height="10" fill="#e34c26"/><rect x="393.62" y="58" width="5.15" height="10" fill="#f1e05a"/><rect x="398.77" y="58" width="4.96" height="10" fill="#89e051"/><rect x="403.74" y="58" width="3.10" height="10" fill="#dea584"/></g></g>
  <g class="fade" style="animation-delay:0.3s">
    <circle cx="31" cy="95" r="6" fill="#3178c6"/>
    <text x="45" y="100" class="label">TypeScript</text>
    <text x="210" y="100" class="muted" text-anchor="end">52.8%</text>
  </g>
  <g class="fade" style="animation-delay:0.38s">
